<!DOCTYPE html>
<html lang="en" data-bs-theme="auto">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="OpenSpoolMan">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>OpenSpoolMan</title>
  <link rel="manifest" href="{{ url_for('static', filename='manifest.webmanifest') }}">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#212529">
  <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}">
  <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/bootstrap.min.css') }}" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/bootstrap-icons.css') }}" rel="stylesheet">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='logo.png') }}">
  <style>
    .bi {
      vertical-align: -.125em;
      fill: currentColor;
    }

    .bd-mode-toggle .dropdown-menu .active .bi {
      display: block !important;
    }
  </style>
</head>
<body class="page-shell">
<header class="p-1 mb-3 border-bottom">
  <div class="container">
    <div class="d-flex flex-nowrap align-items-center app-header-bar">
      <a href="{{ url_for('home') }}" class="d-flex align-items-center link-body-emphasis text-decoration-none app-header-brand">
        <img width="28" height="28" alt="OpenSpoolMan Logo" src="{{ url_for('static', filename='logo.png') }}"/>
        {% if PRINTER_NAME %}
        <h6 class="mb-0 ms-2 text-truncate">{{ PRINTER_NAME}}</h6>
        {% else %}
        <h6 class="mb-0 ms-2 text-truncate">{{ PRINTER_MODEL["model"]}} - {{PRINTER_MODEL["devicename"]}}</h6>
        {% endif %}
      </a>

      <ul class="nav flex-nowrap col-auto ms-auto align-items-center">
        <li><a href="{{ url_for('home') }}" class="nav-link px-2 py-1 small link-body-emphasis" title="Home"><i class="bi bi-house"></i><span class="d-none d-sm-inline ms-1">Home</span></a></li>
        <li><a href="{{ url_for('assign_tag') }}" class="nav-link px-2 py-1 small link-body-emphasis" title="Assign NFC Tag"><i class="bi bi-tag"></i><span class="d-none d-sm-inline ms-1">Assign NFC Tag</span></a></li>
        <li><a href="{{ url_for('print_history') }}" class="nav-link px-2 py-1 small link-body-emphasis" title="Print History"><i class="bi bi-clock-history"></i><span class="d-none d-sm-inline ms-1">Print History</span></a></li>
        <li><a href="{{ SPOOLMAN_BASE_URL }}" target="spoolman" class="nav-link px-2 py-1 small link-body-emphasis" title="SpoolMan"><i class="bi bi-box-seam"></i><span class="d-none d-sm-inline ms-1">SpoolMan</span></a></li>
      </ul>
    </div>
  </div>
</header>
<script>
  if (window.navigator.standalone) {
    document.addEventListener("DOMContentLoaded", function () {
        function attachLinkListeners() {
            document.querySelectorAll("a").forEach(link => {
                link.addEventListener("click", function(event) {
                    const url = new URL(this.href, window.location.origin);
    
                    // Allow normal behavior for external links
                    if (url.origin !== window.location.origin) {
                        return;
                    }
    
                    event.preventDefault(); // Prevent default navigation for internal links
    
                    fetch(this.href)
                        .then(response => response.text())
                        .then(html => {
                            const parser = new DOMParser();
                            const newDocument = parser.parseFromString(html, "text/html");
    
                            // Replace only the body content
                            document.body.innerHTML = newDocument.body.innerHTML;
    
                            attachLinkListeners(); // Rebind event listeners for new links
                            executeScripts(newDocument); // Re-execute all JavaScript code
                        })
                        .catch(error => {
                            const ts = new Date().toISOString();
                            console.error(`[${ts}] Error loading page:`, error);
                        });
                });
            });
        }
    
        function executeScripts(doc) {
            doc.querySelectorAll("script").forEach(oldScript => {
                const newScript = document.createElement("script");
    
                if (oldScript.src) {
                    // If it's an external script, reload it
                    newScript.src = oldScript.src;
                    newScript.onload = () => {
                      const ts = new Date().toISOString();
                      console.log(`[${ts}] Loaded: ${oldScript.src}`);
                    };
                } else {
                    // If it's an inline script, copy and execute it
                    newScript.textContent = oldScript.textContent;
                }
    
                document.body.appendChild(newScript); // Append and execute the script
            });
        }
    
        attachLinkListeners();
    });
  }

  document.addEventListener('DOMContentLoaded', function() {
    if (window.location.hash.length > 0) {
        setTimeout(function() {
            var target = document.querySelector(window.location.hash);
            if (target) {
                target.scrollIntoView({ behavior: 'smooth' });
            }
        }, 400);  // 100ms warten
    }
});
  </script>
<main class="container">
  {% if success_message %}
  <div class="alert alert-success alert-dismissible fade show" role="alert">
    <strong>Success!</strong> {{ success_message }}
    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
  </div>
  {% endif %}
  {% block content %}{% endblock %}
</main>

<div class="container">
  <footer class="d-flex flex-wrap justify-content-between align-items-center py-3 my-4 border-top">
    <ul class="nav col-md-12 justify-content-end list-unstyled d-flex">
      <li class="ms-3"><a class="link-body-emphasis" href="https://github.com/drndos/openspoolman">
        <i class="bi bi-github"></i>
      </a></li>
    </ul>
  </footer>
</div>

<script src="{{ url_for('static', filename='js/bootstrap.bundle.min.js') }}"></script>
<script>
  ;(function () {
    const htmlElement = document.querySelector("html")
    if (htmlElement.getAttribute("data-bs-theme") === 'auto') {
      function updateTheme() {
        document.querySelector("html").setAttribute("data-bs-theme",
            window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
      }

      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', updateTheme)
      updateTheme()
    }
  })()
  document.addEventListener('DOMContentLoaded', function () {
    const popoverTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="popover"]'))
    popoverTriggerList.forEach(function (popoverTriggerEl) {
      const popover = new bootstrap.Popover(popoverTriggerEl, {container: 'body', trigger: 'manual'})
      const showPopover = () => popover.show()
      const hidePopover = () => {
        popover.hide()
        popoverTriggerEl.classList.remove('popover-visible')
      }
      let touchActivated = false

      popoverTriggerEl.addEventListener('mouseenter', showPopover)
      popoverTriggerEl.addEventListener('mouseleave', hidePopover)
      popoverTriggerEl.addEventListener('focus', showPopover)
      popoverTriggerEl.addEventListener('blur', hidePopover)
      popoverTriggerEl.addEventListener('click', function (event) {
        if (touchActivated) {
          touchActivated = false
          return
        }
        event.preventDefault()
        popoverTriggerEl.classList.toggle('popover-visible')
        popoverTriggerEl.classList.contains('popover-visible') ? showPopover() : hidePopover()
      })
      popoverTriggerEl.addEventListener('touchstart', function (event) {
        touchActivated = true
        event.preventDefault()
        popoverTriggerEl.classList.toggle('popover-visible')
        popoverTriggerEl.classList.contains('popover-visible') ? showPopover() : hidePopover()
      }, { passive: false })

      document.addEventListener('click', function (event) {
        if (!popoverTriggerEl.contains(event.target)) {
          hidePopover()
        }
      })
    })
  })
</script>

<!-- patch 7: in-page NFC tag capture (see openspoolman-patch/patch7.py) -->
<style>
  #nfc-pill {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: 12px; z-index: 1080; max-width: 92vw;
    border: 0; border-radius: 999px; padding: .5rem 1rem;
    font-size: .875rem; line-height: 1.2; box-shadow: 0 .25rem .75rem rgba(0,0,0,.3);
    background: var(--bs-secondary-bg, #e9ecef); color: var(--bs-body-color, #212529);
  }
  #nfc-pill.armed { background: var(--bs-success, #198754); color: #fff; }
  #nfc-pill.hot   { background: var(--bs-primary, #0d6efd); color: #fff; }
  #nfc-pill[hidden] { display: none; }
</style>
<button id="nfc-pill" type="button" hidden></button>
<script>
(function () {
  // write_tag owns the NFC radio for pushing; a reader there would grab the
  // freshly written tag and navigate away mid-write.
  if (location.pathname.indexOf('/write_tag') === 0) return;
  if (!('NDEFReader' in window)) return;   // http:// or non-Chrome: no-op

  const pill = document.getElementById('nfc-pill');
  const reader = new NDEFReader();
  let scanning = false, handled = false;

  function say(text, cls) {
    pill.textContent = text;
    pill.className = cls || '';
    pill.hidden = false;
  }

  function tagUrl(message) {
    for (const record of message.records) {
      if (record.recordType !== 'url' && record.recordType !== 'absolute-url') continue;
      try {
        const raw = new TextDecoder(record.encoding || 'utf-8').decode(record.data);
        // Tags may have been written with a different base URL than the one
        // this page was loaded from (LAN vs tailnet). Keep the path, keep the
        // origin we are already on -- that origin is the one that works.
        const u = new URL(raw, location.origin);
        return u.origin === location.origin ? u.href : location.origin + u.pathname + u.search;
      } catch (e) { /* not a URL record we understand */ }
    }
    return null;
  }

  reader.onreading = function (event) {
    if (handled) return;
    const url = tagUrl(event.message);
    if (!url) { say('Tag has no OpenSpoolMan link', ''); return; }
    handled = true;
    say('Opening spool…', 'hot');
    if (navigator.vibrate) navigator.vibrate(40);
    location.replace(url);   // same tab, no history entry
  };

  reader.onreadingerror = function () { say('Could not read that tag — tap again', ''); };

  function start(fromClick) {
    if (scanning) return;
    scanning = true;
    reader.scan().then(function () {
      say('● Tap a spool tag', 'armed');
      setTimeout(function () { if (!handled) pill.hidden = true; }, 4000);
    }).catch(function (err) {
      scanning = false;
      if (err && err.name === 'NotAllowedError' && !fromClick) {
        say('Enable tap-to-scan', '');   // needs a gesture to ask for permission
        return;
      }
      say('NFC unavailable: ' + (err && err.name ? err.name : err), '');
    });
  }

  pill.addEventListener('click', function () {
    if (scanning) { pill.hidden = true; return; }
    start(true);
  });

  // Permission is remembered per origin, so after the first grant every page
  // load arms itself with no tap at all.
  if (navigator.permissions && navigator.permissions.query) {
    navigator.permissions.query({name: 'nfc'}).then(function (status) {
      if (status.state === 'granted') start(false);
      else say('Enable tap-to-scan', '');
    }).catch(function () { start(false); });
  } else {
    start(false);
  }
})();
</script>
</body>
</html>
